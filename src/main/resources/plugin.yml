name: BrawlBox
main: main.BrawlBox
version: 0.1-ALPHA
author: soho030
api-version: 1.16

commands:
  freeze:
    description: Pauses the Timer for easier debugging
    usage: /pause
  i:
    description: gives you an item
    usage: /i [item]
  start:
    description: Start the game early
    usage: /start
  hub:
    description: teleport you to the lobby in case there is something wrong
    usage: /hub
  rounds:
    description: set max number of rounds
    usage: /rounds [number]